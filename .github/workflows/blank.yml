name: Windows Cloud PC - Anydesk (Atualizado)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Instalar AnyDesk via Chocolatey
        shell: pwsh
        run: |
          Write-Host "Instalando o AnyDesk de forma segura via Chocolatey..."
          # Choco instala direto dos pacotes homologados sem tomar bloqueio de bot
          choco install anydesk -y --no-progress
          
          # Garante que o serviço do AnyDesk foi iniciado no Windows
          Write-Host "Iniciando o serviço do AnyDesk..."
          Start-Service -Name "AnyDesk" -ErrorAction SilentlyContinue

      - name: Configurar Senha de Acesso
        shell: cmd
        run: |
          echo Configurando a senha de acesso...
          cd "C:\Program Files (x86)\AnyDesk"
          :: Sua senha para se conectar será: 123456
          echo 123456 | anydesk.exe --set-password

      - name: Pegar o ID e Manter Ligado
        shell: pwsh
        run: |
          cd "C:\Program Files (x86)\AnyDesk"
          
          Write-Host "Aguardando o sistema gerar o ID..."
          Start-Sleep -Seconds 20
          
          # Captura o ID gerado pela máquina virtual
          \$anydeskId = ./anydesk.exe --get-id
          
          Write-Host "=========================================="
          Write-Host "CONECTE USANDO ESTE ID: \$anydeskId"
          Write-Host "A SUA SENHA É: 123456"
          Write-Host "=========================================="

          Write-Host "Mantendo o PC em nuvem ativo..."
          while (\$true) {
              \$process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              if (-not \$process) {
                  Start-Process ./anydesk.exe --silent
              }
              Start-Sleep -Seconds 60
          }
          
