name: Windows Cloud PC - Anydesk (Atualizado)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360 # O GitHub desliga depois de 6 horas para evitar banir sua conta

    steps:
      - name: Baixar e Instalar AnyDesk Oficial
        shell: pwsh
        run: |
          Write-Host "Baixando o AnyDesk direto do servidor oficial..."
          Invoke-WebRequest -Uri "https://anydesk.com" -OutFile "anydesk.exe"
          
          Write-Host "Instalando em segundo plano..."
          Start-Process ./anydesk.exe -ArgumentList "--install `"$env:ProgramFiles(x86)\AnyDesk`" --with-remove-conf --silent" -Wait

      - name: Configurar Senha de Acesso
        shell: cmd
        run: |
          cd "C:\Program Files (x86)\AnyDesk"
          :: A sua senha para conectar no AnyDesk vai ser: 123456
          echo 123456 | anydesk.exe --set-password

      - name: Pegar o ID e Manter Ligado
        shell: pwsh
        run: |
          cd "C:\Program Files (x86)\AnyDesk"
          
          Write-Host "Aguardando o sistema gerar o ID..."
          Start-Sleep -Seconds 15
          
          # Pega o ID da máquina para você conectar
          \$anydeskId = ./anydesk.exe --get-id
          
          Write-Host "=========================================="
          Write-Host "CONECTE USANDO ESTE ID: \$anydeskId"
          Write-Host "A SUA SENHA É: 123456"
          Write-Host "=========================================="

          # Mantém a máquina ligada
          Write-Host "Mantendo o PC em nuvem ativo..."
          while (\(true) {\)process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              if (-not \$process) {
                  Start-Process ./anydesk.exe --silent
              }
              Start-Sleep -Seconds 60
          }
          
